
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Development</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.background {
    position: fixed;
    width: 450px;
    height: 450px;
    background: #087cff;
    filter: blur(180px);
    opacity: .2;
    border-radius: 50%;
    animation: move 7s infinite alternate ease-in-out;
}

@keyframes move {
    from { transform: translate(-100px, -80px); }
    to { transform: translate(100px, 100px); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 520px;
    text-align: center;
    padding: 45px 25px;
    border: 1px solid #252d3b;
    border-radius: 20px;
    background: rgba(15, 21, 33, .85);
    box-shadow: 0 20px 80px #0008;
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.icon {
    font-size: 55px;
    margin-bottom: 25px;
    display: inline-block;
    animation: rotate 5s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.status {
    display: inline-block;
    color: #45b6ff;
    background: #102a40;
    border: 1px solid #174a70;
    padding: 8px 15px;
    border-radius: 30px;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(28px, 6vw, 43px);
    margin-bottom: 15px;
    letter-spacing: -1px;
}

h1 span {
    color: #39a9ff;
}

.description {
    color: #9ba8ba;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #aab6c7;
    font-size: 12px;
    margin-bottom: 10px;
}

.progress {
    height: 6px;
    background: #252d3b;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg, #087cff, #48c6ff);
    border-radius: 10px;
    animation: loading 2s ease;
}

@keyframes loading {
    from { width: 0; }
    to { width: 65%; }
}

.footer {
    color: #66758a;
    font-size: 12px;
    margin-top: 35px;
}

@media(max-width: 480px) {
    .container {
        padding: 35px 20px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<main class="container">

    <div class="icon">⚙️</div>

    <div class="status">
        ● UNDER DEVELOPMENT
    </div>

    <h1>Something <span>Awesome</span><br>Is Coming.</h1>

    <p class="description">
        We're working hard behind the scenes to bring
        you an amazing experience. Our website is
        currently under development.
    </p>

    <div class="progress-info">
        <span>Development progress</span>
        <span>65%</span>
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="footer">
        © 2026 All Rights Reserved.
    </div>

</main>

</body>
</html>
